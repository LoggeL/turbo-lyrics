[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "turbo-lyrics"
version = "0.1.0"
description = "Word-timed lyrics from sung vocal stems on a CPU: packed-VAD Whisper, CTC alignment, reference forced alignment (WhisperX-compatible output)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "LoggeL" }]
keywords = ["lyrics", "karaoke", "whisper", "forced alignment", "ctc", "wav2vec2", "cpu inference", "whisperx"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "soxr>=0.3",
    "faster-whisper>=1.1",
    "torch>=2.3",
    "transformers>=4.40",
]

[project.optional-dependencies]
test = ["pytest>=8"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
turbo-lyrics = "turbo_lyrics.cli:main"

[project.urls]
Homepage = "https://github.com/LoggeL/turbo-lyrics"
Issues = "https://github.com/LoggeL/turbo-lyrics/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/turbo_lyrics"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "benchmarks", "docs", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: needs the real models (downloads ~2 GB on first use); run with --models",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests", "benchmarks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = [
    "S101",
    "S603", "S607",  # subprocess with ffmpeg
    "B905",
    "RUF001", "RUF002", "RUF003",
    "SIM108", "SIM105",
    "E741",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B018"]
"benchmarks/*" = ["S", "T20"]
